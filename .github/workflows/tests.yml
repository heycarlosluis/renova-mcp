name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Protocolo MCP (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, curl, mbstring
          tools: wp-cli
          coverage: none

      - name: Prueba de humo de extremo a extremo
        run: bash tests/run.sh

      - name: Referencia de herramientas sincronizada
        run: |
          wp --path="${TMPDIR:-/tmp}/renova-mcp-test/wp" eval-file scripts/generate-tool-reference.php
          git diff --exit-code -- docs/tools.md docs/tools.json
